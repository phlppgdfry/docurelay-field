name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run: newly published advisories fail the build (warnings are errors), so a
  # vulnerable transitive package is noticed within a week instead of at the next push.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/DocuRelay.Api/DocuRelay.Api.csproj
      - run: dotnet restore src/DocuRelay.Worker/DocuRelay.Worker.csproj
      - run: dotnet restore tests/DocuRelay.Domain.Tests/DocuRelay.Domain.Tests.csproj
      - run: dotnet restore tests/DocuRelay.Api.IntegrationTests/DocuRelay.Api.IntegrationTests.csproj
      - run: dotnet build src/DocuRelay.Api/DocuRelay.Api.csproj --configuration Release --no-restore
      - run: dotnet build src/DocuRelay.Worker/DocuRelay.Worker.csproj --configuration Release --no-restore
      - run: dotnet test tests/DocuRelay.Domain.Tests/DocuRelay.Domain.Tests.csproj --configuration Release --no-restore
      - run: dotnet test tests/DocuRelay.Api.IntegrationTests/DocuRelay.Api.IntegrationTests.csproj --configuration Release --no-restore

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload restore src/DocuRelay.Mobile/DocuRelay.Mobile.csproj
      # The project also targets iOS; GitHub's Linux runner can only validate Android.
      - run: >-
          dotnet publish src/DocuRelay.Mobile/DocuRelay.Mobile.csproj
          --configuration Release
          --framework net10.0-android
          -p:AndroidPackageFormats=apk
      - uses: actions/upload-artifact@v7
        with:
          name: docurelay-field-android-apk
          path: src/DocuRelay.Mobile/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error
