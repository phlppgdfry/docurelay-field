version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]
        # .NET MAUI packages must match the installed .NET SDK and MAUI workload
        # (MA003 / NU1608), so they get their own PRs instead of breaking this group.
        # Not an `ignore`: that would also block MAUI security updates.
        exclude-patterns: ["Microsoft.Maui.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
