version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # .NET MAUI packages must match the installed .NET SDK and MAUI workload,
    # so they move with an SDK upgrade, not in the weekly group (MA003 / NU1608).
    ignore:
      - dependency-name: "Microsoft.Maui.*"
    groups:
      dotnet:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
