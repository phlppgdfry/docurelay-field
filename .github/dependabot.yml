version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # .NET MAUI packages must track the installed .NET SDK and MAUI workload
    # (MA003 / NU1608), so routine version bumps break the build. Ignore MAUI
    # *version* updates only; security updates still come through, because an
    # ignore scoped to version-update: types does not block security updates.
    ignore:
      - dependency-name: "Microsoft.Maui.*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      dotnet:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
