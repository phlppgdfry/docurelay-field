<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DocuRelay Field document processing architecture</title>
  <desc id="desc">A mobile application submits documents to an ASP.NET Core API. An outbox publishes processing jobs to Azure Service Bus and a worker records the completed state in Azure SQL Database. Microsoft Entra ID protects the API.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1128"/><stop offset="1" stop-color="#17234d"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d315e"/><stop offset="1" stop-color="#101a37"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#000824" flood-opacity=".48"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#4ae0cf"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="163" cy="118" r="230" fill="#3b56b7" opacity=".24"/><circle cx="1430" cy="146" r="264" fill="#4b3db5" opacity=".18"/><circle cx="928" cy="790" r="282" fill="#087f83" opacity=".13"/>
  <text x="100" y="118" fill="#56e5d0" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">DOCURELAY FIELD</text>
  <text x="100" y="178" fill="#f2f6ff" font-family="Arial, sans-serif" font-size="50" font-weight="800">Azure-ready document processing</text>
  <text x="100" y="218" fill="#b5c4e5" font-family="Arial, sans-serif" font-size="23">A portfolio workflow that stays runnable locally while mapping directly to Azure services.</text>
  <g filter="url(#shadow)">
    <rect x="100" y="322" width="245" height="214" rx="24" fill="url(#panel)" stroke="#426696" stroke-width="2"/>
    <rect x="415" y="322" width="270" height="214" rx="24" fill="url(#panel)" stroke="#426696" stroke-width="2"/>
    <rect x="760" y="322" width="270" height="214" rx="24" fill="url(#panel)" stroke="#426696" stroke-width="2"/>
    <rect x="1105" y="322" width="270" height="214" rx="24" fill="url(#panel)" stroke="#426696" stroke-width="2"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="128" y="367" fill="#62ead7" font-size="17" font-weight="700" letter-spacing="2">FIELD APP</text><text x="128" y="414" fill="#fff" font-size="28" font-weight="700">.NET MAUI</text><text x="128" y="453" fill="#c1cee9" font-size="20">Offline queue &amp;</text><text x="128" y="482" fill="#c1cee9" font-size="20">evidence capture</text>
    <text x="443" y="367" fill="#62ead7" font-size="17" font-weight="700" letter-spacing="2">WEB API</text><text x="443" y="414" fill="#fff" font-size="28" font-weight="700">App Service</text><text x="443" y="453" fill="#c1cee9" font-size="20">ASP.NET Core API</text><text x="443" y="482" fill="#c1cee9" font-size="20">+ transactional outbox</text>
    <text x="788" y="367" fill="#62ead7" font-size="17" font-weight="700" letter-spacing="2">MESSAGING</text><text x="788" y="414" fill="#fff" font-size="28" font-weight="700">Service Bus</text><text x="788" y="453" fill="#c1cee9" font-size="20">Queue, retries &amp;</text><text x="788" y="482" fill="#c1cee9" font-size="20">dead-letter handling</text>
    <text x="1133" y="367" fill="#62ead7" font-size="17" font-weight="700" letter-spacing="2">BACKGROUND</text><text x="1133" y="414" fill="#fff" font-size="28" font-weight="700">.NET Worker</text><text x="1133" y="453" fill="#c1cee9" font-size="20">Idempotent processing</text><text x="1133" y="482" fill="#c1cee9" font-size="20">Pending → Completed</text>
  </g>
  <path d="M345 429H400" fill="none" stroke="#4ae0cf" stroke-width="5" marker-end="url(#arrow)"/><path d="M685 429H745" fill="none" stroke="#4ae0cf" stroke-width="5" marker-end="url(#arrow)"/><path d="M1030 429H1090" fill="none" stroke="#4ae0cf" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="416" y="653" width="290" height="126" rx="22" fill="#172d54" stroke="#6a5dd7" stroke-width="2"/><rect x="902" y="653" width="290" height="126" rx="22" fill="#172d54" stroke="#6a5dd7" stroke-width="2"/><rect x="1172" y="152" width="260" height="96" rx="20" fill="#172d54" stroke="#6a5dd7" stroke-width="2"/></g>
  <g font-family="Arial, sans-serif"><text x="444" y="699" fill="#af9dff" font-size="16" font-weight="700" letter-spacing="1.5">PERSISTENCE</text><text x="444" y="742" fill="#fff" font-size="28" font-weight="700">Azure SQL Database</text><text x="930" y="699" fill="#af9dff" font-size="16" font-weight="700" letter-spacing="1.5">IDENTITY</text><text x="930" y="742" fill="#fff" font-size="28" font-weight="700">Microsoft Entra ID</text><text x="1200" y="193" fill="#af9dff" font-size="16" font-weight="700" letter-spacing="1.5">SECURITY</text><text x="1200" y="225" fill="#fff" font-size="23" font-weight="700">Bearer token validation</text></g>
  <path d="M550 536V638" fill="none" stroke="#9c87ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M1240 536V638" fill="none" stroke="#9c87ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M1190 248V308H552V322" fill="none" stroke="#9c87ff" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <text x="100" y="847" fill="#9eb2d8" font-family="Arial, sans-serif" font-size="19">Local mode: EF Core InMemory + in-process channel worker. Azure mode: same contracts, Azure SQL and Service Bus through configuration.</text>
</svg>
