name: Android release artifact

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload restore src/DocuRelay.Mobile/DocuRelay.Mobile.csproj
      - run: >-
          dotnet publish src/DocuRelay.Mobile/DocuRelay.Mobile.csproj
          --configuration Release
          --framework net10.0-android
          --property:AndroidPackageFormat=aab
          --output artifacts/android
      - uses: actions/upload-artifact@v4
        with:
          name: docurelay-field-android-aab
          path: artifacts/android/**/*.aab
          if-no-files-found: error
